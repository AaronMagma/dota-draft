<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Dota 2 Draft Simulator</title>
    <style>
        body { background-color: #0b0c10; color: #e5e5e5; font-family: 'Arial', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { display: none; } /* Скрываем громоздкий заголовок */
        
        .main-container { display: flex; width: 100%; max-width: 1300px; gap: 20px; margin-top: 10px; justify-content: center; }
        
        /* СЕТКА ГЕРОЕВ (Левая часть) */
        .heroes-section { width: 72%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; background: #11141a; padding: 20px; border-radius: 6px; border: 1px solid #1f242d; }
        .attribute-box { background: #161920; padding: 15px; border-radius: 4px; border: 1px solid #232935; }
        .attr-title { font-size: 14px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; padding-bottom: 5px; border-bottom: 1px solid #2d3545; }
        .attr-title.str { color: #ff4d4d; }
        .attr-title.agi { color: #22c55e; }
        .attr-title.int { color: #38bdf8; }
        .attr-title.uni { color: #eab308; }
        
        .grid-container { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
        
        .hero-card { cursor: pointer; border: 1px solid #3a4454; border-radius: 4px; aspect-ratio: 16/13; display: flex; align-items: center; justify-content: center; background-color: #0d0f13; font-size: 24px; transition: all 0.15s ease; position: relative; overflow: hidden; }
        .hero-card:hover:not(.disabled) { border-color: #eab308; transform: scale(1.05); z-index: 10; box-shadow: 0 0 10px rgba(234,179,8,0.3); }
        .hero-card.selected { border-color: #22c55e; box-shadow: 0 0 12px #22c55e; z-index: 10; }
        .hero-card.disabled { filter: grayscale(100%) brightness(30%); opacity: 0.4; cursor: not-allowed; border-color: #1f242d; }
        
        /* СТАДИЯ ДРАФТА (Правая часть) */
        .sidebar-draft { width: 26%; background: #11141a; padding: 20px; border-radius: 6px; border: 1px solid #1f242d; display: flex; flex-direction: column; align-items: center; }
        .mode-title { font-size: 13px; font-weight: bold; letter-spacing: 2px; color: #a1a1aa; text-transform: uppercase; margin-bottom: 5px; }
        #status-message { font-size: 12px; font-weight: bold; color: #eab308; text-transform: uppercase; text-align: center; margin-bottom: 15px; letter-spacing: 1px; min-height: 32px; }
        
        #action-btn { background-color: #3a4454; color: #a1a1aa; border: 1px solid #4b5563; padding: 14px; width: 100%; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s; }
        #action-btn.player-turn { background-color: #a91e1e; color: white; border-color: #e11d48; box-shadow: 0 4px 10px rgba(225,29,72,0.3); }
        #action-btn.player-turn:hover { background-color: #be1212; }
        #action-btn.disabled { background-color: #161920; color: #4b5563; border-color: #232935; cursor: not-allowed; }
        
        /* Скрытые контейнеры, чтобы логика скрипта не ломалась */
        .hidden-slots { display: none; }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- СЕТКА ГЕРОЕВ ПО АТРИБУТАМ -->
        <div class="heroes-section">
            <div class="attribute-box">
                <div class="attr-title str">Strength</div>
                <div id="str-container" class="grid-container"></div>
            </div>
            <div class="attribute-box">
                <div class="attr-title agi">Agility</div>
                <div id="agi-container" class="grid-container"></div>
            </div>
            <div class="attribute-box">
                <div class="attr-title int">Intelligence</div>
                <div id="int-container" class="grid-container"></div>
            </div>
            <div class="attribute-box">
                <div class="attr-title uni">Universal</div>
                <div id="uni-container" class="grid-container"></div>
            </div>
        </div>

        <!-- ТУРНИРНАЯ ПАНЕЛЬ СПРАВА -->
        <div class="sidebar-draft">
            <div class="mode-title">Captains Mode</div>
            <div id="status-message">ЗАГРУЗКА...</div>
            <button id="action-btn" class="disabled">ВЫБЕРИТЕ ГЕРОЯ</button>
            
            <!-- Оставляем невидимые слоты, чтобы скрипт записывал туда данные без ошибок -->
            <div class="hidden-slots">
                <div id="r-pick-0"></div><div id="r-pick-1"></div><div id="r-pick-2"></div><div id="r-pick-3"></div><div id="r-pick-4"></div>
                <div id="d-pick-0"></div><div id="d-pick-1"></div><div id="d-pick-2"></div><div id="d-pick-3"></div><div id="d-pick-4"></div>
                <div id="r-ban-0"></div><div id="r-ban-1"></div><div id="r-ban-2"></div><div id="r-ban-3"></div><div id="r-ban-4"></div><div id="r-ban-5"></div><div id="r-ban-6"></div>
                <div id="d-ban-0"></div><div id="d-ban-1"></div><div id="d-ban-2"></div><div id="d-ban-3"></div><div id="d-ban-4"></div><div id="d-ban-5"></div><div id="d-ban-6"></div>
            </div>
        </div>
    </div>

    <!-- Обновляем версию, чтобы мгновенно сбросить старый кэш -->
    <script src="script.js?v=10"></script>
</body>
</html>
