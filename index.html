<!doctype html> <html lang="ru"> <head> <meta charset="UTF-8"/> <meta name="viewport" content="width=device-width, initial-scale=1.0"/> <title>Captain's Mode — Draft Simulator</title> <style> :root{ --bg: #0b1020; --panel: #141a33; --text: #ffffff; --muted: #9aa4b2; } html, body { height: 100%; } body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, Arial, sans-serif; } .wrapper { padding: 22px 28px; display: grid; grid-template-columns: 1fr 320px; gap: 24px; align-items: start; height: 100vh; box-sizing: border-box; } /* Заголовок слева — почти как в макете */ .title { font-size: 40px; font-weight: 800; margin: 0 0 16px 0; letter-spacing: .5px; }
/* Левая часть: 4 панели в 2x2 сетке */
.board {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-gap: 16px;
}
.panel {
  background: #0e122a;
  border: 1px solid #2a2a2a;
  border-radius: 8px;
  padding: 12px;
  min-height: 260px;
}
.panel-header {
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 1px;
  margin-bottom: 8px;
}
.panel-grid {
  display: grid;
  grid-template-columns: repeat(8, 48px);
  grid-gap: 6px;
}
.hero-tile {
  width: 48px;
  height: 48px;
  border-radius: 6px;
  border: 1px solid #333;
  background: linear-gradient(135deg, #2b2b2b, #1a1a1a);
  cursor: pointer;
  transition: transform .1s;
}
.hero-tile:hover { transform: scale(1.05); }

/* Правая панель — Captains Mode */
.side {
  background: #0e122a;
  border: 1px solid #2a2a2a;
  border-radius: 8px;
  padding: 16px;
  height: fit-content;
}
.side h2 {
  margin: 0 0 8px 0;
  font-size: 20px;
  letter-spacing: 1px;
}
.turn {
  font-size: 14px;
  color: #aaa;
  margin: 6px 0 12px 0;
}
.turn-row {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.team {
  padding: 8px 12px;
  background: #1b214c;
  border-radius: 6px;
  font-weight: 700;
  font-size: 12px;
}
.timer {
  padding: 8px 12px;
  background: #1b214c;
  border-radius: 6px;
  font-weight: 700;
  font-family: monospace;
}
.ban-area {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin-top: 12px;
}
.slot {
  height: 28px;
  background: #11152b;
  border: 1px solid #333;
  border-radius: 6px;
}
.ban-btn {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border-radius: 6px;
  border: 0;
  background: #2b2f58;
  color: #fff;
  font-weight: 700;
  cursor: pointer;
}

@media (max-width: 1024px){
  .wrapper { grid-template-columns: 1fr; height: auto; }
  .side { order: -1; }
}
</style> </head> <body> <div class="wrapper"> <div> <h1 class="title">Captain's Mode — Draft Simulator</h1>
  <!-- Левая часть: 4 панели -->
  <div id="board" class="board" aria-label="Герои по ролям"></div>
</div>

<!-- Правая панель -->
<aside class="side" aria-label="Панель драфта">
  <h2>CAPTAINS MODE</h2>
  <div class="turn" style="display:flex; justify-content:space-between; align-items:center;">
    <span>YOUR TURN TO BAN HERO</span>
    <span class="timer" id="timer">1:26</span>
  </div>

  <div class="turn-row" style="margin-top:6px;">
    <div class="team" style="flex:1; text-align:center;">RADIANT</div>
    <div class="team" style="flex:1; text-align:center;">DIRE</div>
  </div>

  <div class="ban-area" id="banSlots" aria-label="Бан-поля"></div>

  <button class="ban-btn" id="banHeroBtn" disabled>BAN HERO</button>
</aside>
</div> <script type="module" src="./gameLogic.js"></script> </body> </html>
