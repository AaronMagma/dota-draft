<!doctype html> <html lang="ru"> <head> <meta charset="UTF-8"/> <meta name="viewport" content="width=device-width, initial-scale=1.0"/> <title>Captain's Mode — Draft Simulator</title> <style> :root{ --bg: #0b1020; --panel: #141a33; --text: #ffffff; --muted: #9aa4b2; --tile: #1b1f38; } html, body { height: 100%; } body { margin: 0; background: #0b1020; color: var(--text); font-family: system-ui, -apple-system, Arial, sans-serif; } .wrapper { padding: 20px 28px; display: grid; grid-template-columns: 1fr 360px; grid-gap: 24px; align-items: start; min-height: 100vh; } .title { font-size: 40px; font-weight: 900; margin: 6px 0 18px; letter-spacing: .4px; } #board { display: grid; grid-template-columns: repeat(2, 1fr); grid-gap: 16px; } .panel { background: #0f1430; border: 1px solid #2a2a4a; border-radius: 10px; padding: 12px; } .panel-header { font-weight: 800; font-size: 14px; letter-spacing: 1px; color: #8fb3ff; margin-bottom: 8px; text-transform: uppercase; } .panel-grid { display: grid; grid-template-columns: repeat(8, 48px); grid-gap: 6px; } .hero-tile { width: 48px; height: 48px; border-radius: 6px; border: 1px solid #333; background: #1b1f38; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 18px; user-select: none; } .hero-tile[data-selected="true"] { outline: 2px solid #ffd166; outline-offset: 2px; } .hero-name { font-size: 12px; text-align: center; margin-top: 6px; color: #d6d6ff; white-space: nowrap; }
/* Правая панель Captains Mode */
.side {
  background: #0f1430;
  border: 1px solid #2a2a4a;
  border-radius: 10px;
  padding: 16px;
  height: fit-content;
}
.side h2 {
  margin: 0 0 12px;
  font-size: 20px;
  letter-spacing: 1px;
  text-align: left;
}
.turn {
  font-size: 14px;
  color: #a6a6a6;
  margin: 6px 0 12px;
}
.timer {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 6px;
  background: #1e1f2e;
  font-family: monospace;
  font-weight: 700;
}
.team-row {
  display: flex;
  gap: 8px;
  margin: 8px 0 12px;
}
.team-pill {
  padding: 8px 12px;
  border-radius: 6px;
  background: #1b214c;
  font-weight: 700;
  color: #fff;
}
#banSlots {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin: 8px 0 12px;
}
.ban-slot {
  height: 28px;
  border-radius: 6px;
  background: #11152b;
  border: 1px solid #333;
}
.ban-btn {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border-radius: 6px;
  border: 0;
  background: #2b2f58;
  color: #fff;
  font-weight: 700;
  cursor: pointer;
}
@media (max-width: 980px){
  .wrapper { grid-template-columns: 1fr; }
  #board { grid-template-columns: 1fr 1fr; }
}
</style> </head> <body> <div class="wrapper"> <div> <div class="title">Captain's Mode — Draft Simulator</div> <div id="board" aria-label="Герои по ролям"></div> </div>
<aside class="side" aria-label="Панель драфта">
  <h2>CAPTAINS MODE</h2>
  <div class="turn">
    YOUR TURN TO BAN HERO
    <span class="timer" id="timer">1:26</span>
  </div>

  <div class="team-row" aria-label="Команды">
    <div class="team-pill" style="background:#2a2a58;">RADIANT</div>
    <div class="team-pill" style="background:#2a2a58; opacity:.6;">DIRE</div>
  </div>

  <div id="banSlots" aria-label="Бан - слоты"></div>

  <button id="banHeroBtn" class="ban-btn" disabled>BAN HERO</button>
</aside>
</div> <script type="module" src="./gameLogic.js"></script>

<script type="module" src="/dota-draft/analyzer.js"></script>

<!-- Подключаем основную логику игры -->
<script type="module" src="/dota-draft/gameLogic.js"></script>

<!-- ВАШ СТАРЫЙ ФАЙЛ ПОДКЛЮЧАЕМ КАК МОДУЛЬ! -->
<script type="module" src="/dota-draft/script.js"></script>

</body> </html>
