<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Dota 2 Draft Simulator (Strength Only)</title>
    <style>
        body { background-color: #0b0c10; color: #e5e5e5; font-family: 'Arial', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .main-container { display: flex; width: 100%; max-width: 1200px; gap: 20px; margin-top: 10px; justify-content: center; align-items: flex-start; }
        
        /* СЕТКА ГЕРОЕВ (Левая часть) */
        .heroes-section { width: 65%; background: #11141a; padding: 20px; border-radius: 6px; border: 1px solid #1f242d; box-sizing: border-box; }
        .attribute-box { background: #161920; padding: 15px; border-radius: 4px; border: 1px solid #232935; }
        .attr-title { font-size: 16px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 15px; padding-bottom: 5px; border-bottom: 1px solid #2d3545; color: #ff4d4d; }
        
        /* Сетка 4 в ряд для красивого отображения 12 героев */
        .grid-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        
        .hero-card { 
            cursor: pointer; 
            border: 1px solid #3a4454; 
            border-radius: 4px; 
            aspect-ratio: 16/9; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background-color: #0d0f13; 
            transition: all 0.15s ease; 
            position: relative; 
            overflow: hidden; 
        }
        
        .hero-card img, .slot-display img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }
        
        .hero-card:hover:not(.disabled) { border-color: #eab308; transform: scale(1.05); z-index: 10; box-shadow: 0 0 10px rgba(234,179,8,0.3); }
        .hero-card.selected { border-color: #22c55e; box-shadow: 0 0 12px #22c55e; z-index: 10; }
        .hero-card.disabled { filter: grayscale(100%) brightness(30%); opacity: 0.4; cursor: not-allowed; border-color: #1f242d; }
        
        /* СТАДИЯ ДРАФТА (Правая часть) */
        .sidebar-draft { width: 33%; background: #11141a; padding: 20px; border-radius: 6px; border: 1px solid #1f242d; display: flex; flex-direction: column; align-items: center; box-sizing: border-box; }
        .mode-title { font-size: 11px; font-weight: bold; letter-spacing: 2px; color: #a1a1aa; text-transform: uppercase; margin-bottom: 5px; }
        #status-message { font-size: 14px; font-weight: bold; color: #eab308; text-transform: uppercase; text-align: center; margin-bottom: 15px; letter-spacing: 1px; min-height: 40px; line-height: 1.4; white-space: pre-line; }
        
        #action-btn { background-color: #161920; color: #4b5563; border: 1px solid #232935; padding: 14px; width: 100%; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s; margin-bottom: 20px; }
        #action-btn.player-turn { background-color: #a91e1e; color: white; border-color: #e11d48; box-shadow: 0 4px 10px rgba(225,29,72,0.3); }
        #action-btn.player-turn:hover { background-color: #be1212; }
        #action-btn.disabled { background-color: #161920; color: #4b5563; border-color: #232935; cursor: not-allowed; }
        
        /* ТАБЛИЦА ШАГОВ */
        .panel-headers { display: flex; width: 100%; justify-content: space-between; font-size: 11px; font-weight: bold; color: #a1a1aa; text-transform: uppercase; letter-spacing: 1px; padding: 0 5px 8px 5px; border-bottom: 1px solid #232935; margin-bottom: 5px; box-sizing: border-box; }
        .panel-headers .rad-h { color: #22c55e; }
        .panel-headers .dire-h { color: #f87171; text-align: right; }
        
        .draft-list { display: flex; flex-direction: column; gap: 4px; width: 100%; box-sizing: border-box; }

        .draft-row { display: grid; grid-template-columns: 50px 1fr 50px; align-items: center; background: #161920; padding: 6px 10px; border-radius: 4px; border: 1px solid #1f242d; box-sizing: border-box; }
        .draft-row.active-row { border-color: #eab308; background: #1d222c; }
        
        .row-center-info { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .row-num { font-size: 10px; color: #52525b; font-weight: bold; }
        
        .row-type-badge { font-size: 9px; font-weight: bold; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; letter-spacing: 0.5px; text-align: center; min-width: 35px; }
        .row-type-badge.ban-badge { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        .row-type-badge.pick-badge { background: rgba(34, 197, 94, 0.15); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.3); }
        
        .slot-display { width: 42px; height: 28px; background: #0d0f13; border: 1px solid #3a4454; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 16px; box-sizing: border-box; }
        .slot-display.empty-slot { border-style: dashed; opacity: 0.3; }
        
        .slot-display.filled-ban { filter: grayscale(100%) brightness(40%); background: #221212; border-color: #552222; }
        .slot-display.filled-pick { background: #122216; border-color: #22552e; }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- СЕТКА СИЛАЧЕЙ -->
        <div class="heroes-section">
            <div class="attribute-box">
                <div class="attr-title">Strength Heroes (12)</div>
                <div id="str-container" class="grid-container"></div>
            </div>
        </div>

        <!-- ПАНЕЛЬ ДРАФТА -->
        <div class="sidebar-draft">
            <div class="mode-title">Short Draft Mode</div>
            <div id="status-message">ЗАГРУЗКА...</div>
            <button id="action-btn" class="disabled">ВЫБЕРИТЕ ГЕРОЯ</button>
            
            <div class="panel-headers">
                <span class="rad-h">Radiant</span>
                <span class="dire-h">Dire</span>
            </div>
            
            <div id="draft-list-container" class="draft-list"></div>
        </div>
    </div>

    <script>
        document.write('<script src="script.js?v=' + Date.now() + '"><\/script>');
    </script>
</body>
</html>
